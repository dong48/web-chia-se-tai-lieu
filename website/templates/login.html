{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h2 style="text-align: center; color: #0056b3;">Đăng Nhập</h2>
    <form method="POST">
        <label>Tên đăng nhập:</label>
        <input type="text" name="username" required>
        
        <label>Mật khẩu:</label>
        <input type="password" name="password" required>
        
        <button type="submit" style="width: 100%;">Đăng Nhập</button>
    </form>
    <p style="text-align: center; margin-top: 15px;">Chưa có tài khoản? <a href="/register">Đăng ký ngay</a></p>
</div>
{% endblock %}
